
<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

#main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

#main div {
    background-color: white !important;
    padding: 15px !important;
    margin: 0 !important;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: 0.3s;
}

#main div:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

#main img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    margin-bottom: 10px;
}

#main h3 {
    color: #222;
    margin-bottom: 10px;
}

#main p {
    color: #666;
    margin-bottom: 8px;
    font-size: 14px;
}

#main b {
    color: green;
    font-size: 18px;
}
</style>
</head>
<body>

<h1>Products</h1>

<div id="main"></div>

<script>

async function getProducts() {

    let res = await fetch("https://dummyjson.com/products?limit=40");

    let data = await res.json();

    data.products.forEach(p => {

        document.getElementById("main").innerHTML += `
            <div style="background:#eee; padding:10px; margin:10px;">
                <img src="${p.thumbnail}" width="150">
                <h3>${p.title}</h3>
                <p>${p.description}</p>
                <b>Price: $${p.price}</b>
                <p>Category: ${p.category}</p>
                <p>Rating: ${p.rating}</p>
            </div>
        `;

    });

}

getProducts();

</script>

</body>
</html>
